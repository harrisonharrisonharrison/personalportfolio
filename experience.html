<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pfp2.jpg" />
    <link rel="stylesheet" href="//fonts.googleapis.com/css?family=Bitcount+Grid+Double&effect=fire" />
    <link rel="stylesheet" href="//fonts.googleapis.com/css?family=Exo+2&effect=fire" />
    <link rel="stylesheet" href="//fonts.googleapis.com/css?family=Space+Mono" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>experience</title>
  </head>
  <div id="preload"></div>
  <body>
    <canvas id="bg"></canvas>
    <style type="text/css">
        #warning-message { display: none; }
        @media only screen and (orientation:portrait){
            #main { display:none; }
            #warning-message { display:block; width: 100%; height: 100%; 
                            position: fixed; top: 0; left: 0; 
                            background-color: rgba(0, 0, 0, 0.8); 
                            color: white; font-size: 2em; 
                            display: flex; align-items: center; 
                            justify-content: center; z-index: 1000; }
        }
        @media only screen and (orientation:landscape){
            #warning-message { display:none; }
        }
    </style>
    <div id="warning-message">
        this website is only viewable in landscape mode
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
          const links = document.querySelectorAll(".navbar-links a");
          const currentPath = window.location.pathname;

          links.forEach(link => {
            if (link.getAttribute("href") === currentPath) {
              link.classList.add("active");
            }
          });
        });
    </script>
    <div style="color: white; z-index: 1000; text-align: center; position: fixed; top: 3vh; width:100%;">
        <div class='navbar'>
          <div class="navbar-links" style="font-family: 'Space Mono'; font-weight: bolder;">
            <a href="/projects.html">Projects</a>
            <a href="/">Home</a>
            <a href="/stats.html">Statistics</a>
          </div>
        </div>
    </div>
    <main class="">

    </main>
    <script type="module" src="src/exp.js"></script>
    </body>
  
</html>
